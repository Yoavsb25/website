name: Lighthouse

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@a7487c7e89a18be500035ba77b504471abd873dd # v4.1.0
        with:
          version: 9.15.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SITE_URL: https://yoavsb25.github.io
          NEXT_PUBLIC_GITHUB_USERNAME: Yoavsb25
        run: pnpm build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@2f8dda67ae9cbd95623f973ee5998335b007ce5e # v12.1.0
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
