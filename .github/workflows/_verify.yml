name: Verify

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify (defaults to the triggering commit)
        required: false
        type: string
    secrets:
      GH_PROFILE_TOKEN:
        required: false
    outputs:
      artifact-name:
        description: Name of the uploaded static site artifact
        value: site-out

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18be500035ba77b504471abd873dd # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Knip
        run: pnpm knip

      - name: Spellcheck
        run: pnpm cspell

      - name: Markdownlint
        run: pnpm markdownlint

      - name: Unit tests
        run: pnpm test:coverage

  build:
    name: Static export
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18be500035ba77b504471abd873dd # v4.1.0
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SITE_URL: https://yoavsb25.github.io
          NEXT_PUBLIC_GITHUB_USERNAME: Yoavsb25
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
        run: pnpm build

      - name: Upload site artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: site-out
          path: out
          retention-days: 7
