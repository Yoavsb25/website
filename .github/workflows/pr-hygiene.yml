name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semantic-title:
    name: Semantic PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  labeler:
    name: Auto label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a378ea068359aca907bd9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  size:
    name: PR size
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: codelytv/pr-size-labeler@20f16b2d46f7400b9d7635811fc93875c956a073 # v1.10.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: size/xs
          xs_max_size: 50
          s_label: size/s
          s_max_size: 200
          m_label: size/m
          m_max_size: 800
          l_label: size/l
          l_max_size: 2000
          xl_label: size/xl
          fail_if_xl: false
